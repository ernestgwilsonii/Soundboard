services:
  # Reverse Proxy: TLS termination + Let's Encrypt certificates
  # - Port 80 redirects to 443 (ACME HTTP-01 challenges are still answered)
  # - Real domain (set DOMAIN/LETSENCRYPT_EMAIL in .env) => Let's Encrypt cert
  # - Local development (DOMAIN unset => localhost) => Traefik self-signed cert
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Uncomment to test against the Let's Encrypt staging CA (avoids rate limits):
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ACME account key + certificates (never committed to git)
      - traefik_letsencrypt:/letsencrypt

  # The Main Application (Production-like)
  app:
    build:
      context: .
      target: production
    image: soundboard-app:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.soundboard.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.soundboard.entrypoints=websecure
      - traefik.http.routers.soundboard.tls=true
      - traefik.http.routers.soundboard.tls.certresolver=letsencrypt
      - traefik.http.services.soundboard.loadbalancer.server.port=8000
    volumes:
      # Persist SQLite Databases
      - db_data:/app/data
      # Persist User Uploads (Audio/Images)
      - upload_data:/app/app/static/uploads
      # Uncomment the next line for "Hot Reloading" / Live Code Editing:
      # - .:/app
    environment:
      - ACCOUNTS_DB=/app/data/accounts.sqlite3
      - SOUNDBOARDS_DB=/app/data/soundboards.sqlite3
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_QUEUE=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - MAIL_SERVER=mailpit
      - MAIL_PORT=1025
      # Trust X-Forwarded-* headers from Traefik (https URLs, OAuth redirects)
      - TRUST_PROXY=true
    depends_on:
      - redis
      - mailpit
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      # Bound to localhost only: never expose Redis on a public interface
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      # Bound to localhost only (use an SSH tunnel to view the UI remotely)
      - "127.0.0.1:8025:8025" # Web UI
      - "127.0.0.1:1025:1025" # SMTP Port
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mailpit_data:/data

  # The Test Runner (Troubleshooting & Verification)
  # Run with: docker compose run --rm test
  test:
    build:
      context: .
      target: test
    image: soundboard-test:latest
    volumes:
      # Mount code so tests run against current local changes
      - .:/app
      # Use a temporary DB location or memory for tests (managed by conftest)
    environment:
      - TESTING=true
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_QUEUE=false
      - MAIL_SERVER=mailpit
      - MAIL_PORT=1025
    depends_on:
      - redis
      - mailpit
    # Keep container alive if you want to exec into it, or just run pytest
    command: pytest

volumes:
  db_data:
  upload_data:
  redis_data:
  mailpit_data:
  traefik_letsencrypt:
